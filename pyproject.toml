[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mllm-self-steering"
version = "0.1.0"
description = "Contrastive capability-vector extraction and activation steering for multimodal LLMs"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.0",
    "datasets>=3.0",
    "openai>=1.66",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "safetensors>=0.4",
    "torch>=2.5",
    "transformers>=4.57",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

